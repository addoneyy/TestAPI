login:
  -
    name: 正确账号密码登录成功
    variables:
      phone: "18212341234"
      code: "123456"
    request:
      url: http://www.xxx/api/login
      method: post
      json:
        phone: ${phone}
        code: ${code}
    validate:
      - "eq": ["status_code", 200]
      - "eq": ["$.msg", "登录成功！"]
      - "eq": ["$.data.status", 1]
      - "eq": ["select * from user where phone ='${phone}' and status = 1", 1]
  -
    name: 账号正确密码错误登录失败
    variables:
      phone: "18212341234"
      code: "111222"
    request:
      url: http://www.xxx/api/login
      method: post
      json:
        phone: ${phone}
        code: ${code}
    validate:
      - "eq": ["status_code", 200]
      - "eq": ["$.msg", "密码错误，登录失败！"]
